<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Factory Departments — GarmentFlow ERP</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
  </style>
</head>
<body class="bg-[#f8fafc] text-gray-800 antialiased min-h-screen flex flex-col">

  <header class="lg:hidden flex items-center justify-between bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-30 shadow-2xs">
    <div class="flex items-center space-x-2">
      <span class="text-xl">🧵</span>
      <span class="font-extrabold text-gray-900 text-lg">GarmentFlow ERP</span>
    </div>
    <button id="mobile-menu-toggle" class="p-2 border border-gray-200 rounded-lg text-gray-600 focus:outline-none">☰</button>
  </header>

  <div class="flex flex-1 min-h-screen">
    <aside id="erp-sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-gray-200/90 flex flex-col justify-between transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-200 ease-in-out shrink-0 shadow-sm"></aside>

    <main class="flex-1 flex flex-col min-w-0 bg-[#f8fafc] overflow-y-auto">
      
      <div class="bg-white border-b border-gray-200/80 px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 sticky top-0 z-20 shadow-2xs">
        <div>
          <h1 class="text-xl font-black text-gray-950 tracking-tight">Factory Production Departments</h1>
          <p class="text-xs text-gray-500 font-medium">Manage manufacturing departments, worker allocations, and pipeline routing</p>
        </div>

        <div class="flex items-center gap-2.5">
          <button id="open-dept-modal" class="px-3.5 py-2 bg-[#124b4f] hover:bg-[#0c383b] text-white text-xs font-bold rounded-xl shadow-xs transition-all flex items-center gap-1.5 cursor-pointer">
            <span>+</span>
            <span>Add Department</span>
          </button>
        </div>
      </div>

      <div class="p-6 space-y-6 max-w-7xl w-full mx-auto">
        <div id="departments-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          <!-- Rendered by JS -->
        </div>
      </div>
    </main>
  </div>

  <!-- ADD DEPARTMENT MODAL -->
  <div id="dept-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <h3 class="font-extrabold text-gray-950 text-sm">Add Production Department</h3>
        <button id="close-dept-modal" class="text-gray-400 hover:text-gray-900 font-bold">✕</button>
      </div>

      <form id="dept-form" class="space-y-3 text-xs">
        <div>
          <label class="font-bold text-gray-700 block mb-1">Department Name</label>
          <input type="text" id="dept-name" required placeholder="e.g. Ironing & Finishing" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-gray-100">
          <button type="button" id="cancel-dept-btn" class="px-4 py-2 border border-gray-200 rounded-xl font-bold text-gray-600 hover:bg-gray-50">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-[#124b4f] hover:bg-[#0c383b] text-white font-bold rounded-xl shadow-xs">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/departments.js"></script>
</body>
</html>
