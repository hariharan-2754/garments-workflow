<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Departments - GarmentFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#F8FAFC] text-gray-800">

  <!-- Mobile Top Navigation Header -->
  <header class="lg:hidden flex items-center justify-between bg-white border-b border-gray-200 px-4 py-3 shadow-sm">
    <div class="flex items-center space-x-2">
      <span class="text-xl">🧵</span>
      <span class="font-bold text-gray-900">GarmentFlow</span>
    </div>
    <button id="mobile-menu-toggle" class="p-2 border border-gray-200 rounded-lg text-gray-600 focus:outline-none hover:bg-gray-50">
      ☰
    </button>
  </header>

  <div class="flex min-h-screen">
    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-gray-200 flex flex-col transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-150 ease-in-out">
      <div class="p-6 border-b border-gray-200 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span class="text-2xl">🧵</span>
          <span class="text-lg font-bold text-gray-900 tracking-tight">GarmentFlow</span>
        </div>
        <button id="mobile-menu-close" class="lg:hidden p-2 text-gray-500 hover:text-gray-900 font-semibold">×</button>
      </div>

      <nav class="flex-1 px-4 py-6 space-y-1">
        <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
          <span>📋</span> <span>Dashboard</span>
        </a>
        <a href="assign-task.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
          <span>✍️</span> <span>Assign Task</span>
        </a>
        <a href="departments.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-semibold bg-blue-50 text-blue-600">
          <span>🏢</span> <span>Departments</span>
        </a>
        <a href="workers.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
          <span>👷</span> <span>Workers</span>
        </a>
      </nav>

      <div class="p-4 border-t border-gray-200">
        <div class="px-4 py-3 bg-gray-50 rounded-lg mb-2">
          <div id="user-name" class="text-sm font-semibold text-gray-900 truncate">—</div>
          <div class="text-xs text-gray-500 uppercase tracking-wider">Admin</div>
        </div>
        <button id="logout-btn" class="w-full flex items-center justify-center space-x-2 px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition-colors">
          <span>🚪</span> <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Layout / Content Wrapper -->
    <main class="flex-1 flex flex-col min-w-0 lg:pl-0">
      <!-- Desktop Header -->
      <header class="hidden lg:flex items-center justify-between bg-white border-b border-gray-200 px-8 py-4 shadow-sm">
        <h1 class="text-xl font-bold text-gray-900">Departments</h1>
      </header>

      <!-- Departments Page Content -->
      <div class="flex-1 p-6 lg:p-8 max-w-4xl w-full mx-auto space-y-6">
        
        <!-- Add Department Inline Card Form -->
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
          <h2 class="text-sm font-bold text-gray-900 mb-4 uppercase tracking-wider text-gray-600">Add New Department</h2>
          <form id="add-dept-form" class="flex flex-col md:flex-row gap-3">
            <input type="text" id="dept-name" required placeholder="Department Name (e.g., Stitching)" 
              class="flex-1 px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 transition-colors" />
            <button type="submit" id="add-btn" 
              class="bg-[#2563EB] text-white px-6 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors">
              Add Department
            </button>
          </form>
        </div>

        <!-- Departments List Table -->
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm">
          <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-lg font-bold text-gray-900">Department List</h2>
          </div>

          <div class="table-responsive">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-600 uppercase tracking-wider">
                  <th class="px-6 py-3">Department Name</th>
                  <th class="px-6 py-3 text-right">Worker Count</th>
                </tr>
              </thead>
              <tbody id="departments-table-body" class="divide-y divide-gray-200 text-sm">
                <tr>
                  <td colspan="2" class="px-6 py-8 text-center text-gray-400">Loading departments...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="js/departments.js"></script>
</body>
</html>
