<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GarmentFlow Redirecting...</title>
  <script type="module">
    import { getUser } from './js/api.js';
    const user = getUser();
    if (!user) {
      window.location.href = '/login.html';
    } else if (user.role === 'ADMIN') {
      window.location.href = '/dashboard.html';
    } else {
      window.location.href = '/worker-home.html';
    }
  </script>
</head>
<body style="background-color: #F8FAFC;">
  <div style="font-family: sans-serif; text-align: center; margin-top: 100px; color: #64748B;">
    <p>Loading GarmentFlow...</p>
  </div>
</body>
</html>
