<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — GarmentFlow</title>
  
  <!-- Google Fonts: Plus Jakarta Sans / Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            tealBrand: '#124b4f',
            tealDark: '#0c383b',
            tealLight: '#e4f2f3',
            sidebarActive: '#eef4ff',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Mobile Top Navigation Header -->
  <header class="lg:hidden flex items-center justify-between bg-white border-b border-gray-200 px-4 py-3 shadow-2xs">
    <div class="flex items-center space-x-2">
      <span class="text-xl">🧵</span>
      <span class="font-extrabold text-gray-900 text-lg tracking-tight">GarmentFlow</span>
    </div>
    <button id="mobile-menu-toggle" class="p-2 border border-gray-200 rounded-lg text-gray-600 focus:outline-none hover:bg-gray-50 cursor-pointer">
      ☰
    </button>
  </header>

  <div class="flex flex-1 min-h-screen">
    
    <!-- ================= 1. SIDEBAR NAVIGATION ================= -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-60 bg-white border-r border-gray-200/90 flex flex-col justify-between transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-200 ease-in-out select-none shrink-0">
      
      <div>
        <!-- Brand Logo Header -->
        <div class="p-5 border-b border-gray-100 flex items-center justify-between">
          <a href="dashboard.html" class="flex items-center space-x-2.5">
            <span class="text-2xl">🧵</span>
            <span class="text-lg font-extrabold text-gray-950 tracking-tight">GarmentFlow</span>
          </a>
          <button id="mobile-menu-close" class="lg:hidden p-1.5 text-gray-400 hover:text-gray-900 font-bold">✕</button>
        </div>

        <!-- Navigation Menu Links -->
        <nav class="p-3.5 space-y-1.5 text-xs font-semibold">
          <!-- 1. Dashboard (Active Pill) -->
          <a href="dashboard.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl bg-blue-50 text-blue-600 font-bold transition-all shadow-2xs">
            <span class="text-base">📋</span>
            <span>Dashboard</span>
          </a>

          <!-- 2. Assign Task -->
          <a href="assign-task.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
            <span class="text-base">✍️</span>
            <span>Assign Task</span>
          </a>

          <!-- 3. Departments -->
          <a href="departments.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
            <span class="text-base">🏢</span>
            <span>Departments</span>
          </a>

          <!-- 4. Workers -->
          <a href="workers.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
            <span class="text-base">👷</span>
            <span>Workers</span>
          </a>
        </nav>
      </div>

      <!-- User Profile Box & Logout (Bottom) -->
      <div class="p-4 border-t border-gray-100 space-y-2">
        <div class="px-3.5 py-2.5 bg-gray-50 rounded-xl">
          <div id="user-name" class="text-xs font-bold text-gray-900 truncate">Admin User</div>
          <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">ADMIN</div>
        </div>
        <button id="logout-btn" class="w-full flex items-center space-x-2 px-3.5 py-2 text-xs font-bold text-red-600 hover:bg-red-50 rounded-xl transition-colors cursor-pointer">
          <span>🚪</span>
          <span>Logout</span>
        </button>
      </div>

    </aside>

    <!-- ================= 2. MAIN WORKSPACE ================= -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#f8fafc]">
      
      <!-- Top Desktop Header Bar -->
      <header class="hidden lg:flex items-center justify-between bg-white border-b border-gray-200/90 px-8 py-3.5 shadow-2xs">
        <h1 class="text-base font-extrabold text-gray-900 tracking-tight">Dashboard</h1>
      </header>

      <!-- Dashboard Body Content -->
      <div class="flex-1 p-6 lg:p-8 max-w-[1560px] w-full mx-auto space-y-6">
        
        <!-- Page Title & Subtitle Header -->
        <div>
          <h2 class="text-xl sm:text-2xl font-extrabold text-gray-950 tracking-tight">
            Worker Task Dashboard
          </h2>
          <p class="text-xs sm:text-sm font-medium text-gray-500 mt-1">
            Showing <span id="pipeline-count" class="font-bold text-gray-900">9</span> actives worker jobs in production pipeline
          </p>
        </div>

        <!-- 3-Column Worker Task Cards Grid -->
        <div id="worker-cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Rendered dynamically via js/dashboard.js -->
        </div>

      </div>

    </main>

  </div>

  <!-- ================= ASSIGN WORKER MODAL ================= -->
  <div id="assign-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-gray-100 space-y-4">
      <div class="flex items-center justify-between border-b border-gray-100 pb-3">
        <h3 class="text-sm font-extrabold text-[#124b4f]">👤 Reassign Worker</h3>
        <button id="close-assign-modal" class="text-gray-400 hover:text-gray-700 text-sm font-bold cursor-pointer">✕</button>
      </div>

      <form id="assign-form" class="space-y-3.5 text-xs">
        <div>
          <label class="block font-bold text-gray-700 mb-1">Job ID</label>
          <input type="text" id="assign-job-id" readonly class="w-full px-3 py-2 bg-gray-100 border border-gray-200 rounded-xl font-mono text-gray-600 font-bold" />
        </div>
        <div>
          <label class="block font-bold text-gray-700 mb-1">Select New Worker</label>
          <select id="assign-worker-select" class="w-full px-3 py-2 border border-gray-200 rounded-xl font-medium focus:border-teal-700 cursor-pointer">
            <option value="Worker David Chen">Worker David Chen (Stitching Master)</option>
            <option value="Li Wei">Li Wei (Senior Pattern Cutter)</option>
            <option value="Amara Okafor">Amara Okafor (Silk Screen Specialist)</option>
            <option value="Worker Maria">Worker Maria (Cutting Supervisor)</option>
            <option value="Ravi Kumar">Ravi Kumar (Cutting Operator)</option>
            <option value="Priya Sharma">Priya Sharma (Stitching Operator)</option>
            <option value="Arjun Patel">Arjun Patel (Quality Inspector)</option>
          </select>
        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" id="cancel-assign-btn" class="px-4 py-2 border border-gray-200 rounded-xl font-semibold hover:bg-gray-50 cursor-pointer">Cancel</button>
          <button type="submit" class="px-5 py-2 bg-[#124b4f] hover:bg-[#0c383b] text-white font-bold rounded-xl cursor-pointer shadow-xs">Confirm Assignment</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= UPDATE TASK PROGRESS MODAL ================= -->
  <div id="update-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-gray-100 space-y-4">
      <div class="flex items-center justify-between border-b border-gray-100 pb-3">
        <h3 class="text-sm font-extrabold text-[#124b4f]">↻ Update Task Progress</h3>
        <button id="close-update-modal" class="text-gray-400 hover:text-gray-700 text-sm font-bold cursor-pointer">✕</button>
      </div>

      <form id="update-form" class="space-y-3.5 text-xs">
        <div>
          <label class="block font-bold text-gray-700 mb-1">Job ID</label>
          <input type="text" id="update-job-id" readonly class="w-full px-3 py-2 bg-gray-100 border border-gray-200 rounded-xl font-mono text-gray-600 font-bold" />
        </div>
        <div>
          <label class="block font-bold text-gray-700 mb-1">Production Stage</label>
          <select id="update-stage-select" class="w-full px-3 py-2 border border-gray-200 rounded-xl font-medium focus:border-teal-700 cursor-pointer">
            <option value="Cutting">Stage 1: Cutting (30%)</option>
            <option value="Stitching T-Shirt">Stage 2: Stitching (65%)</option>
            <option value="Printing T-Shirt">Stage 3: Printing / Embroidery (80%)</option>
            <option value="Quality Inspection">Stage 4: Quality Check (90%)</option>
            <option value="Completed">Stage 5: Completed (100%)</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-gray-700 mb-1">Progress Percentage (%)</label>
          <input type="number" id="update-progress-input" min="0" max="100" class="w-full px-3 py-2 border border-gray-200 rounded-xl font-mono font-bold focus:border-teal-700" />
        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" id="cancel-update-btn" class="px-4 py-2 border border-gray-200 rounded-xl font-semibold hover:bg-gray-50 cursor-pointer">Cancel</button>
          <button type="submit" class="px-5 py-2 bg-[#124b4f] hover:bg-[#0c383b] text-white font-bold rounded-xl cursor-pointer shadow-xs">Save Progress</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODULE SCRIPT -->
  <script type="module" src="js/dashboard.js"></script>

</body>
</html>
