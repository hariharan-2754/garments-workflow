<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - GarmentFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#F8FAFC] text-gray-800">

  <!-- Mobile Top Navigation Header -->
  <header class="lg:hidden flex items-center justify-between bg-white border-b border-gray-200 px-4 py-3 shadow-sm">
    <div class="flex items-center space-x-2">
      <span class="text-xl">🧵</span>
      <span class="font-bold text-gray-900">GarmentFlow</span>
    </div>
    <button id="mobile-menu-toggle" class="p-2 border border-gray-200 rounded-lg text-gray-600 focus:outline-none hover:bg-gray-50">
      ☰
    </button>
  </header>

  <div class="flex min-h-screen">
    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-gray-200 flex flex-col transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-150 ease-in-out">
      <div class="p-6 border-b border-gray-200 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span class="text-2xl">🧵</span>
          <span class="text-lg font-bold text-gray-900 tracking-tight">GarmentFlow</span>
        </div>
        <button id="mobile-menu-close" class="lg:hidden p-2 text-gray-500 hover:text-gray-900 font-semibold">×</button>
      </div>

      <nav class="flex-1 px-4 py-6 space-y-1">
        <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-semibold bg-blue-50 text-blue-600">
          <span>📋</span> <span>Dashboard</span>
        </a>
        <a href="assign-task.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
          <span>✍️</span> <span>Assign Task</span>
        </a>
        <a href="departments.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
          <span>🏢</span> <span>Departments</span>
        </a>
        <a href="workers.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
          <span>👷</span> <span>Workers</span>
        </a>
      </nav>

      <div class="p-4 border-t border-gray-200">
        <div class="px-4 py-3 bg-gray-50 rounded-lg mb-2">
          <div id="user-name" class="text-sm font-semibold text-gray-900 truncate">—</div>
          <div class="text-xs text-gray-500 uppercase tracking-wider">Admin</div>
        </div>
        <button id="logout-btn" class="w-full flex items-center justify-center space-x-2 px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition-colors">
          <span>🚪</span> <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Layout / Content Wrapper -->
    <main class="flex-1 flex flex-col min-w-0 lg:pl-0">
      <!-- Desktop Header -->
      <header class="hidden lg:flex items-center justify-between bg-white border-b border-gray-200 px-8 py-4 shadow-sm">
        <h1 class="text-xl font-bold text-gray-900">Dashboard</h1>
      </header>

      <!-- Dashboard View Content -->
      <div class="flex-1 p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-8">
        
        <!-- Metrics Summary Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Total Tasks</div>
            <div id="stat-total" class="text-3xl font-bold text-gray-900 mt-2">—</div>
          </div>
          <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Pending</div>
            <div id="stat-pending" class="text-3xl font-bold text-amber-600 mt-2">—</div>
          </div>
          <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Completed</div>
            <div id="stat-completed" class="text-3xl font-bold text-green-600 mt-2">—</div>
          </div>
          <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Not Completed</div>
            <div id="stat-not-completed" class="text-3xl font-bold text-red-600 mt-2">—</div>
          </div>
        </div>

        <!-- Task Monitoring Section -->
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm">
          <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
            <h2 class="text-lg font-bold text-gray-900">Task Monitoring</h2>
            <div class="text-xs text-gray-500 flex items-center gap-1.5 bg-gray-50 px-2.5 py-1 rounded">
              <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
              Auto-updating
            </div>
          </div>

          <div class="table-responsive">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-600 uppercase tracking-wider">
                  <th class="px-6 py-3">Task Details</th>
                  <th class="px-6 py-3">Worker</th>
                  <th class="px-6 py-3">Department</th>
                  <th class="px-6 py-3">Status</th>
                  <th class="px-6 py-3">Due Date</th>
                  <th class="px-6 py-3">Last Updated</th>
                  <th class="px-6 py-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="tasks-table-body" class="divide-y divide-gray-200 text-sm">
                <tr>
                  <td colspan="7" class="px-6 py-8 text-center text-gray-400">Loading tasks...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
