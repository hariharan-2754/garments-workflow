<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee & Workforce Directory — GarmentFlow ERP</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
  </style>
</head>
<body class="bg-[#f8fafc] text-gray-800 antialiased min-h-screen flex flex-col">

  <header class="lg:hidden flex items-center justify-between bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-30 shadow-2xs">
    <div class="flex items-center space-x-2">
      <span class="text-xl">🧵</span>
      <span class="font-extrabold text-gray-900 text-lg">GarmentFlow ERP</span>
    </div>
    <button id="mobile-menu-toggle" class="p-2 border border-gray-200 rounded-lg text-gray-600 focus:outline-none">☰</button>
  </header>

  <div class="flex flex-1 min-h-screen">
    <aside id="erp-sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-gray-200/90 flex flex-col justify-between transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-200 ease-in-out shrink-0 shadow-sm"></aside>

    <main class="flex-1 flex flex-col min-w-0 bg-[#f8fafc] overflow-y-auto">
      
      <div class="bg-white border-b border-gray-200/80 px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 sticky top-0 z-20 shadow-2xs">
        <div>
          <h1 class="text-xl font-black text-gray-950 tracking-tight">Factory Workforce & Employee Directory</h1>
          <p class="text-xs text-gray-500 font-medium">Manage employees, designations, department rosters, shifts, salary structures, and role permissions</p>
        </div>

        <div class="flex items-center gap-2.5">
          <button id="open-worker-modal" class="px-3.5 py-2 bg-[#124b4f] hover:bg-[#0c383b] text-white text-xs font-bold rounded-xl shadow-xs transition-all flex items-center gap-1.5 cursor-pointer">
            <span>+</span>
            <span>Add New Employee</span>
          </button>
        </div>
      </div>

      <div class="p-6 space-y-6 max-w-7xl w-full mx-auto">

        <!-- Filters Bar -->
        <div class="bg-white p-4 rounded-2xl border border-gray-200/80 shadow-2xs flex flex-wrap items-center justify-between gap-4">
          <div class="flex flex-wrap items-center gap-3">
            <input type="text" id="search-worker" placeholder="Search by name, email, or phone..." class="px-3 py-1.5 bg-gray-50 border border-gray-200 rounded-xl text-xs w-64 focus:outline-none" />
            <select id="filter-dept" class="px-3 py-1.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-semibold focus:outline-none">
              <option value="">All Departments</option>
              <option value="Cutting">Cutting</option>
              <option value="Stitching">Stitching</option>
              <option value="Printing">Printing</option>
              <option value="Embroidery">Embroidery</option>
              <option value="Quality Check">Quality Check</option>
              <option value="Packing">Packing</option>
            </select>
            <select id="filter-role" class="px-3 py-1.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-semibold focus:outline-none">
              <option value="">All Roles</option>
              <option value="WORKER">Worker</option>
              <option value="SUPERVISOR">Supervisor</option>
              <option value="MANAGER">Manager</option>
              <option value="ADMIN">Admin</option>
            </select>
          </div>
        </div>

        <!-- Employees Table -->
        <div class="bg-white rounded-2xl border border-gray-200/80 shadow-2xs overflow-hidden">
          <table class="w-full text-left text-xs">
            <thead class="bg-gray-50/80 text-gray-600 font-bold border-b border-gray-100">
              <tr>
                <th class="py-3 px-4">Employee</th>
                <th class="py-3 px-4">Designation</th>
                <th class="py-3 px-4">Department</th>
                <th class="py-3 px-4">Role</th>
                <th class="py-3 px-4">Shift / Type</th>
                <th class="py-3 px-4">Phone</th>
                <th class="py-3 px-4">Status</th>
              </tr>
            </thead>
            <tbody id="workers-tbody" class="divide-y divide-gray-100 font-medium">
              <tr><td colspan="7" class="py-6 text-center text-gray-400">Loading workforce roster...</td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <!-- ADD EMPLOYEE MODAL -->
  <div id="worker-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <h3 class="font-extrabold text-gray-950 text-sm">Add New Factory Employee</h3>
        <button id="close-worker-modal" class="text-gray-400 hover:text-gray-900 font-bold">✕</button>
      </div>

      <form id="worker-form" class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="font-bold text-gray-700 block mb-1">Full Name</label>
            <input type="text" id="emp-name" required placeholder="e.g. Anand Kumar" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
          </div>
          <div>
            <label class="font-bold text-gray-700 block mb-1">Email Address</label>
            <input type="email" id="emp-email" required placeholder="anand@garmentflow.com" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="font-bold text-gray-700 block mb-1">Password</label>
            <input type="password" id="emp-password" required minlength="6" value="Worker@1234" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
          </div>
          <div>
            <label class="font-bold text-gray-700 block mb-1">Phone Number</label>
            <input type="text" id="emp-phone" required placeholder="9876543210" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="font-bold text-gray-700 block mb-1">Department</label>
            <select id="emp-department" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
              <option value="Cutting">Cutting</option>
              <option value="Stitching" selected>Stitching</option>
              <option value="Printing">Printing</option>
              <option value="Embroidery">Embroidery</option>
              <option value="Quality Check">Quality Check</option>
              <option value="Packing">Packing</option>
            </select>
          </div>
          <div>
            <label class="font-bold text-gray-700 block mb-1">Designation</label>
            <input type="text" id="emp-designation" placeholder="e.g. Master Tailor" value="Tailor" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="font-bold text-gray-700 block mb-1">System Role</label>
            <select id="emp-role" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
              <option value="WORKER" selected>Worker</option>
              <option value="SUPERVISOR">Supervisor</option>
              <option value="MANAGER">Manager</option>
              <option value="ADMIN">Admin</option>
            </select>
          </div>
          <div>
            <label class="font-bold text-gray-700 block mb-1">Shift</label>
            <select id="emp-shift" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
              <option value="General" selected>General (09:00 - 18:00)</option>
              <option value="Morning">Morning Shift</option>
              <option value="Evening">Evening Shift</option>
              <option value="Night">Night Shift</option>
            </select>
          </div>
          <div>
            <label class="font-bold text-gray-700 block mb-1">Monthly Salary (₹)</label>
            <input type="number" id="emp-salary" step="any" value="22000" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-gray-100">
          <button type="button" id="cancel-worker-btn" class="px-4 py-2 border border-gray-200 rounded-xl font-bold text-gray-600 hover:bg-gray-50">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-[#124b4f] hover:bg-[#0c383b] text-white font-bold rounded-xl shadow-xs">Register Employee</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/workers.js"></script>
</body>
</html>
