<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assign Task — GarmentFlow</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Mobile Top Navigation Header -->
  <header class="lg:hidden flex items-center justify-between bg-white border-b border-gray-200 px-4 py-3 shadow-2xs">
    <div class="flex items-center space-x-2">
      <span class="text-xl">🧵</span>
      <span class="font-extrabold text-gray-900 text-lg tracking-tight">GarmentFlow</span>
    </div>
    <button id="mobile-menu-toggle" class="p-2 border border-gray-200 rounded-lg text-gray-600 focus:outline-none hover:bg-gray-50 cursor-pointer">
      ☰
    </button>
  </header>

  <div class="flex flex-1 min-h-screen">
    
    <!-- ================= SIDEBAR NAVIGATION ================= -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-60 bg-white border-r border-gray-200/90 flex flex-col justify-between transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-200 ease-in-out select-none shrink-0">
      
      <div>
        <!-- Brand Logo Header -->
        <div class="p-5 border-b border-gray-100 flex items-center justify-between">
          <a href="dashboard.html" class="flex items-center space-x-2.5">
            <span class="text-2xl">🧵</span>
            <span class="text-lg font-extrabold text-gray-950 tracking-tight">GarmentFlow</span>
          </a>
          <button id="mobile-menu-close" class="lg:hidden p-1.5 text-gray-400 hover:text-gray-900 font-bold">✕</button>
        </div>

        <!-- Navigation Menu Links -->
        <nav class="p-3.5 space-y-1.5 text-xs font-semibold">
          <!-- 1. Dashboard -->
          <a href="dashboard.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
            <span class="text-base">📋</span>
            <span>Dashboard</span>
          </a>

          <!-- 2. Assign Task (Active Pill) -->
          <a href="assign-task.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl bg-blue-50 text-blue-600 font-bold transition-all shadow-2xs">
            <span class="text-base">✍️</span>
            <span>Assign Task</span>
          </a>

          <!-- 3. Departments -->
          <a href="departments.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
            <span class="text-base">🏢</span>
            <span>Departments</span>
          </a>

          <!-- 4. Workers -->
          <a href="workers.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
            <span class="text-base">👷</span>
            <span>Workers</span>
          </a>
        </nav>
      </div>

      <!-- User Profile Box & Logout (Bottom) -->
      <div class="p-4 border-t border-gray-100 space-y-2">
        <div class="px-3.5 py-2.5 bg-gray-50 rounded-xl">
          <div id="user-name" class="text-xs font-bold text-gray-900 truncate">Admin User</div>
          <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">ADMIN</div>
        </div>
        <button id="logout-btn" class="w-full flex items-center space-x-2 px-3.5 py-2 text-xs font-bold text-red-600 hover:bg-red-50 rounded-xl transition-colors cursor-pointer">
          <span>🚪</span>
          <span>Logout</span>
        </button>
      </div>

    </aside>

    <!-- ================= MAIN WORKSPACE ================= -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#f8fafc]">
      
      <!-- Top Desktop Header Bar -->
      <header class="hidden lg:flex items-center justify-between bg-white border-b border-gray-200/90 px-8 py-3.5 shadow-2xs">
        <h1 class="text-base font-extrabold text-gray-900 tracking-tight">Assign Task</h1>
      </header>

      <!-- Page Content Body -->
      <div class="flex-1 p-6 lg:p-8 max-w-2xl w-full mx-auto">
        <div class="bg-white rounded-2xl border border-gray-200/90 shadow-2xs p-6 sm:p-8">
          <h2 class="text-sm font-bold text-gray-900 mb-6 border-b border-gray-100 pb-3 flex items-center justify-between">
            <span>Production Task Specifications</span>
            <span class="text-[11px] font-normal text-gray-400">Step 1 of 1</span>
          </h2>

          <form id="assign-task-form" class="space-y-4 text-xs">
            <div>
              <label for="task-title" class="block font-bold text-gray-700 mb-1.5 uppercase tracking-wider text-[11px]">Task / Garment Title *</label>
              <input type="text" id="task-title" required placeholder="e.g., Stitch 200 blue collar patches" 
                class="w-full px-4 py-2.5 bg-gray-50/50 border border-gray-200 rounded-xl text-xs font-medium focus:bg-white focus:outline-none focus:border-blue-600 transition-colors" />
            </div>

            <div>
              <label for="task-description" class="block font-bold text-gray-700 mb-1.5 uppercase tracking-wider text-[11px]">Description &amp; Specifications *</label>
              <textarea id="task-description" required rows="3" placeholder="Detail the stitch pattern, fabric weight, measurements, or specs..."
                class="w-full px-4 py-2.5 bg-gray-50/50 border border-gray-200 rounded-xl text-xs font-medium focus:bg-white focus:outline-none focus:border-blue-600 transition-colors resize-none"></textarea>
            </div>

            <div>
              <label for="task-department" class="block font-bold text-gray-700 mb-1.5 uppercase tracking-wider text-[11px]">Target Department *</label>
              <select id="task-department" required 
                class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-xs font-medium focus:outline-none focus:border-blue-600 transition-colors cursor-pointer">
                <option value="">Select a department...</option>
              </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label for="task-priority" class="block font-bold text-gray-700 mb-1.5 uppercase tracking-wider text-[11px]">Priority Level</label>
                <select id="task-priority" required 
                  class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-xs font-medium focus:outline-none focus:border-blue-600 transition-colors cursor-pointer">
                  <option value="Low">Low Priority</option>
                  <option value="Medium" selected>Medium Priority</option>
                  <option value="High">High Priority (Urgent)</option>
                </select>
              </div>

              <div>
                <label for="task-due-date" class="block font-bold text-gray-700 mb-1.5 uppercase tracking-wider text-[11px]">Target Due Date *</label>
                <input type="date" id="task-due-date" required
                  class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-xs font-medium focus:outline-none focus:border-blue-600 transition-colors cursor-pointer" />
              </div>
            </div>

            <div>
              <label for="task-image" class="block font-bold text-gray-700 mb-1.5 uppercase tracking-wider text-[11px]">Reference Photo / Tech Pack (Optional)</label>
              <input type="file" id="task-image" accept="image/*" 
                class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-colors cursor-pointer" />
            </div>

            <div class="pt-3">
              <button type="submit" id="submit-btn"
                class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white py-3 rounded-xl text-xs font-bold transition-all shadow-xs cursor-pointer">
                Assign &amp; Dispatch Task
              </button>
            </div>
          </form>
        </div>
      </div>

    </main>

  </div>

  <script type="module" src="js/assign-task.js?v=1.0.2"></script>

</body>
</html>
