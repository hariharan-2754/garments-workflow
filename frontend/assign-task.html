<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dispatch Task / Job Card — GarmentFlow ERP</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
  </style>
</head>
<body class="bg-[#f8fafc] text-gray-800 antialiased min-h-screen flex flex-col">

  <header class="lg:hidden flex items-center justify-between bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-30 shadow-2xs">
    <div class="flex items-center space-x-2">
      <span class="text-xl">🧵</span>
      <span class="font-extrabold text-gray-900 text-lg">GarmentFlow ERP</span>
    </div>
    <button id="mobile-menu-toggle" class="p-2 border border-gray-200 rounded-lg text-gray-600 focus:outline-none">☰</button>
  </header>

  <div class="flex flex-1 min-h-screen">
    <aside id="erp-sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-gray-200/90 flex flex-col justify-between transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-200 ease-in-out shrink-0 shadow-sm"></aside>

    <main class="flex-1 flex flex-col min-w-0 bg-[#f8fafc] overflow-y-auto">
      
      <div class="bg-white border-b border-gray-200/80 px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 sticky top-0 z-20 shadow-2xs">
        <div>
          <h1 class="text-xl font-black text-gray-950 tracking-tight">Dispatch Production Task & Job Spec</h1>
          <p class="text-xs text-gray-500 font-medium">Issue garment operations with visual spec photos and department assignments</p>
        </div>
      </div>

      <div class="p-6 space-y-6 max-w-2xl w-full mx-auto">
        <div class="bg-white p-6 rounded-2xl border border-gray-200/80 shadow-2xs">
          
          <form id="assign-task-form" class="space-y-4 text-xs">
            <div>
              <label class="font-bold text-gray-700 block mb-1">Task Title / Garment Operation</label>
              <input type="text" id="task-title" required placeholder="e.g. Cut 500 pcs Front Panel & Sleeve Placket" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
            </div>

            <div>
              <label class="font-bold text-gray-700 block mb-1">Detailed Technical Specifications</label>
              <textarea id="task-desc" required rows="3" placeholder="Pattern grading guidelines, seam allowances, stitch density..." class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="font-bold text-gray-700 block mb-1">Department</label>
                <select id="task-dept" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none"></select>
              </div>
              <div>
                <label class="font-bold text-gray-700 block mb-1">Priority</label>
                <select id="task-priority" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none">
                  <option value="High">High Priority</option>
                  <option value="Medium" selected>Medium Priority</option>
                  <option value="Low">Low Priority</option>
                </select>
              </div>
            </div>

            <div>
              <label class="font-bold text-gray-700 block mb-1">Target Deadline</label>
              <input type="date" id="task-duedate" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
            </div>

            <div>
              <label class="font-bold text-gray-700 block mb-1">Reference Spec Sheet / Photo (Optional)</label>
              <input type="file" id="task-image" accept="image/*" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none text-gray-500" />
            </div>

            <div class="pt-3 border-t border-gray-100 flex justify-end gap-2">
              <a href="dashboard.html" class="px-4 py-2 border border-gray-200 rounded-xl font-bold text-gray-600 hover:bg-gray-50">Cancel</a>
              <button type="submit" class="px-5 py-2.5 bg-[#124b4f] hover:bg-[#0c383b] text-white font-bold rounded-xl shadow-xs cursor-pointer">
                Dispatch Task to Department
              </button>
            </div>
          </form>

        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/assign-task.js"></script>
</body>
</html>
