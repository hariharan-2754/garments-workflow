<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assign Task - GarmentFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#F8FAFC] text-gray-800">

  <!-- Mobile Top Navigation Header -->
  <header class="lg:hidden flex items-center justify-between bg-white border-b border-gray-200 px-4 py-3 shadow-sm">
    <div class="flex items-center space-x-2">
      <span class="text-xl">🧵</span>
      <span class="font-bold text-gray-900">GarmentFlow</span>
    </div>
    <button id="mobile-menu-toggle" class="p-2 border border-gray-200 rounded-lg text-gray-600 focus:outline-none hover:bg-gray-50">
      ☰
    </button>
  </header>

  <div class="flex min-h-screen">
    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-gray-200 flex flex-col transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-150 ease-in-out">
      <div class="p-6 border-b border-gray-200 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span class="text-2xl">🧵</span>
          <span class="text-lg font-bold text-gray-900 tracking-tight">GarmentFlow</span>
        </div>
        <button id="mobile-menu-close" class="lg:hidden p-2 text-gray-500 hover:text-gray-900 font-semibold">×</button>
      </div>

      <nav class="flex-1 px-4 py-6 space-y-1">
        <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
          <span>📋</span> <span>Dashboard</span>
        </a>
        <a href="assign-task.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-semibold bg-blue-50 text-blue-600">
          <span>✍️</span> <span>Assign Task</span>
        </a>
        <a href="departments.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
          <span>🏢</span> <span>Departments</span>
        </a>
        <a href="workers.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-950 transition-colors">
          <span>👷</span> <span>Workers</span>
        </a>
      </nav>

      <div class="p-4 border-t border-gray-200">
        <div class="px-4 py-3 bg-gray-50 rounded-lg mb-2">
          <div id="user-name" class="text-sm font-semibold text-gray-900 truncate">—</div>
          <div class="text-xs text-gray-500 uppercase tracking-wider">Admin</div>
        </div>
        <button id="logout-btn" class="w-full flex items-center justify-center space-x-2 px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition-colors">
          <span>🚪</span> <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Layout / Content Wrapper -->
    <main class="flex-1 flex flex-col min-w-0 lg:pl-0">
      <!-- Desktop Header -->
      <header class="hidden lg:flex items-center justify-between bg-white border-b border-gray-200 px-8 py-4 shadow-sm">
        <h1 class="text-xl font-bold text-gray-900">Assign Task</h1>
      </header>

      <!-- Assign Task Page Content -->
      <div class="flex-1 p-6 lg:p-8 max-w-2xl w-full mx-auto">
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-6 lg:p-8">
          <h2 class="text-lg font-bold text-gray-900 mb-6 border-b border-gray-100 pb-3">New Task Details</h2>

          <form id="assign-task-form" class="space-y-5">
            <div>
              <label for="task-title" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Task Title</label>
              <input type="text" id="task-title" required placeholder="e.g., Stitch 200 blue collar patches" 
                class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 transition-colors" />
            </div>

            <div>
              <label for="task-description" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Description</label>
              <textarea id="task-description" required rows="4" placeholder="Detail the stitch pattern, specifications, or comments..."
                class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 transition-colors resize-none"></textarea>
            </div>

            <div>
              <label for="task-department" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Department</label>
              <select id="task-department" required 
                class="w-full px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 transition-colors">
                <option value="">Select a department...</option>
              </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label for="task-priority" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Priority</label>
                <select id="task-priority" required 
                  class="w-full px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 transition-colors">
                  <option value="Low">Low</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="High">High</option>
                </select>
              </div>

              <div>
                <label for="task-due-date" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Due Date</label>
                <input type="date" id="task-due-date" required
                  class="w-full px-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 transition-colors" />
              </div>
            </div>

            <div>
              <label for="task-image" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Reference Image (Optional)</label>
              <input type="file" id="task-image" accept="image/*" 
                class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-colors" />
            </div>

            <div class="pt-4">
              <button type="submit" id="submit-btn"
                class="w-full bg-[#2563EB] text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors">
                Assign Task
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/assign-task.js?v=1.0.2"></script>
</body>
</html>
