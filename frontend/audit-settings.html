<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings & Audit Logs — GarmentFlow ERP</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
  </style>
</head>
<body class="bg-[#f8fafc] text-gray-800 antialiased min-h-screen flex flex-col">

  <header class="lg:hidden flex items-center justify-between bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-30 shadow-2xs">
    <div class="flex items-center space-x-2">
      <span class="text-xl">🧵</span>
      <span class="font-extrabold text-gray-900 text-lg">GarmentFlow ERP</span>
    </div>
    <button id="mobile-menu-toggle" class="p-2 border border-gray-200 rounded-lg text-gray-600 focus:outline-none">☰</button>
  </header>

  <div class="flex flex-1 min-h-screen">
    <aside id="erp-sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-gray-200/90 flex flex-col justify-between transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-200 ease-in-out shrink-0 shadow-sm"></aside>

    <main class="flex-1 flex flex-col min-w-0 bg-[#f8fafc] overflow-y-auto">
      
      <div class="bg-white border-b border-gray-200/80 px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 sticky top-0 z-20 shadow-2xs">
        <div>
          <h1 class="text-xl font-black text-gray-950 tracking-tight">Factory Settings & System Audit Trail</h1>
          <p class="text-xs text-gray-500 font-medium">Configurable factory shift hours, overtime thresholds, and tamper-evident audit logs</p>
        </div>
      </div>

      <div class="p-6 space-y-6 max-w-7xl w-full mx-auto">

        <!-- Tabs -->
        <div class="flex items-center border-b border-gray-200 gap-4">
          <button id="tab-settings" class="pb-3 text-xs font-bold border-b-2 border-[#124b4f] text-[#124b4f]">
            ⚙️ Factory & Shift Configuration
          </button>
          <button id="tab-audit" class="pb-3 text-xs font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-900">
            🛡️ Security Audit Logs
          </button>
        </div>

        <!-- ================= 1. SYSTEM SETTINGS ================= -->
        <div id="settings-section" class="space-y-4 max-w-2xl">
          <div class="bg-white p-6 rounded-2xl border border-gray-200/80 shadow-2xs">
            <form id="settings-form" class="space-y-4 text-xs">
              <h3 class="font-extrabold text-gray-950 text-sm border-b border-gray-100 pb-2">Factory Shift & Attendance Rules</h3>
              
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="font-bold text-gray-700 block mb-1">Shift Start Time</label>
                  <input type="time" id="set-shift-start" value="09:00" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
                </div>
                <div>
                  <label class="font-bold text-gray-700 block mb-1">Shift End Time</label>
                  <input type="time" id="set-shift-end" value="18:00" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="font-bold text-gray-700 block mb-1">Late Grace Period (Minutes)</label>
                  <input type="number" id="set-grace-mins" value="15" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
                </div>
                <div>
                  <label class="font-bold text-gray-700 block mb-1">Overtime Threshold (Hours)</label>
                  <input type="number" id="set-ot-thresh" step="any" value="8.5" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
                </div>
              </div>

              <h3 class="font-extrabold text-gray-950 text-sm border-b border-gray-100 pb-2 pt-2">Company Information</h3>
              <div>
                <label class="font-bold text-gray-700 block mb-1">Company Name</label>
                <input type="text" id="set-company-name" value="GarmentFlow Apparels Ltd." required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
              </div>
              <div>
                <label class="font-bold text-gray-700 block mb-1">Factory Location</label>
                <input type="text" id="set-company-addr" value="Sector 5, Industrial Apparel Park, Tirupur, India" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none" />
              </div>

              <div class="pt-3 border-t border-gray-100">
                <button type="submit" class="px-5 py-2.5 bg-[#124b4f] hover:bg-[#0c383b] text-white font-bold rounded-xl shadow-xs cursor-pointer">
                  Save Shift & Factory Settings
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- ================= 2. AUDIT LOGS ================= -->
        <div id="audit-section" class="space-y-4 hidden">
          <div class="bg-white rounded-2xl border border-gray-200/80 shadow-2xs overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="bg-gray-50/80 text-gray-600 font-bold border-b border-gray-100">
                <tr>
                  <th class="py-3 px-4">Timestamp</th>
                  <th class="py-3 px-4">User</th>
                  <th class="py-3 px-4">Role</th>
                  <th class="py-3 px-4">Module</th>
                  <th class="py-3 px-4">Action Summary</th>
                </tr>
              </thead>
              <tbody id="audit-tbody" class="divide-y divide-gray-100 font-medium">
                <tr><td colspan="5" class="py-6 text-center text-gray-400">Loading audit trail...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="js/audit-settings.js"></script>
</body>
</html>
