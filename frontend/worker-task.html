<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Details - GarmentFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#F8FAFC] text-gray-800 min-h-screen flex flex-col">

  <!-- Top Navbar Only -->
  <nav class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🧵</span>
        <span class="font-bold text-gray-900 tracking-tight">GarmentFlow</span>
      </div>
      <button id="logout-btn" class="text-sm font-semibold text-red-600 hover:text-red-700 transition-colors">
        Logout
      </button>
    </div>
  </nav>

  <!-- Content Container -->
  <main class="flex-1 max-w-xl w-full mx-auto p-4 md:p-6 space-y-4">
    
    <!-- Back to tasks list navigation link -->
    <div class="mb-2">
      <a href="worker-home.html" class="inline-flex items-center text-sm font-semibold text-blue-600 hover:underline">
        ← Back to My Tasks
      </a>
    </div>

    <!-- Task details card -->
    <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-6 space-y-6">
      
      <!-- Loading indicator -->
      <div id="loading-state" class="text-center text-gray-400 py-12">
        Loading task details...
      </div>

      <!-- Main task content (hidden initially) -->
      <div id="task-content" class="hidden space-y-6">
        <div>
          <div class="flex items-center flex-wrap gap-2 mb-2">
            <span id="task-priority" class="px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider rounded">Priority</span>
            <span id="task-status" class="px-2 py-0.5 text-xs font-semibold rounded-full">Status</span>
          </div>
          <h1 id="task-title" class="text-xl font-bold text-gray-900 leading-tight">Task Title</h1>
        </div>

        <div class="border-t border-b border-gray-100 py-4 space-y-2.5 text-sm text-gray-600">
          <div class="flex justify-between">
            <span class="font-medium text-gray-400">Department</span>
            <span id="task-dept" class="font-semibold text-gray-800">—</span>
          </div>
          <div class="flex justify-between">
            <span class="font-medium text-gray-400">Due Date</span>
            <span id="task-due-date" class="font-semibold text-gray-800">—</span>
          </div>
        </div>

        <div class="space-y-1.5">
          <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Instructions</h3>
          <p id="task-desc" class="text-sm text-gray-700 leading-relaxed whitespace-pre-line bg-gray-50 p-4 rounded-lg border border-gray-100">Task instructions description...</p>
        </div>

        <!-- Optional Reference Image -->
        <div id="image-container" class="hidden space-y-2">
          <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Reference Image</h3>
          <img id="task-image" src="" alt="Reference" class="w-full max-h-80 object-contain rounded-lg border border-gray-200 bg-gray-50" />
        </div>

        <!-- Submission Status Indicator -->
        <div id="submission-status" class="hidden p-4 rounded-lg text-center font-bold text-sm bg-green-50 text-green-700 border border-green-200">
          Response Submitted
        </div>

        <!-- Action Buttons (shown only when Pending) -->
        <div id="actions-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
          <button id="complete-btn" class="w-full bg-green-600 text-white py-3 rounded-lg text-sm font-semibold hover:bg-green-700 transition-colors shadow-sm focus:outline-none">
            ✅ Complete
          </button>
          <button id="not-completed-btn" class="w-full bg-red-600 text-white py-3 rounded-lg text-sm font-semibold hover:bg-red-700 transition-colors shadow-sm focus:outline-none">
            ❌ Not Completed
          </button>
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="js/worker-task.js"></script>
</body>
</html>
