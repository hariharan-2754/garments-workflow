<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worker Registration - Mindly°</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & Instrument Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Instrument Serif"', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f7f7f5;
      color: #0f172a;
      overflow-x: hidden;
    }

    /* Glassmorphism styling */
    .glass-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.03);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(0.5deg); }
    }

    @keyframes float-reverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-0.5deg); }
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-float-slow { animation: float-slow 6s ease-in-out infinite; }
    .animate-float-reverse { animation: float-reverse 7s ease-in-out infinite; }
    .animate-spin-slow { animation: spin-slow 20s linear infinite; }
  </style>
</head>
<body class="min-h-screen bg-[#f7f7f5] text-[#0f172a] flex flex-col justify-between relative selection:bg-slate-900 selection:text-white p-4 sm:p-6 lg:p-8">

  <!-- Subtle ambient background glow -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[900px] h-[500px] bg-gradient-to-b from-white/90 via-slate-100/50 to-transparent blur-3xl pointer-events-none -z-10"></div>

  <!-- TOP HEADER -->
  <header class="w-full max-w-6xl mx-auto flex items-center justify-between py-2 z-20">
    <!-- Brand Logo -->
    <a href="index.html" class="flex items-center space-x-1 group">
      <span class="text-2xl font-extrabold tracking-tight text-[#0f172a] font-sans">Mindly<span class="text-xs align-super font-bold">°</span></span>
    </a>

    <!-- Already have an account link -->
    <a href="login.html" class="bg-white/80 border border-gray-200/80 hover:bg-white text-gray-800 px-4 py-2 rounded-full text-xs font-semibold shadow-2xs transition-all flex items-center gap-1.5">
      <span>Sign In</span>
      <span>→</span>
    </a>
  </header>

  <!-- MAIN REGISTER CONTAINER -->
  <main class="w-full max-w-6xl mx-auto flex-1 flex items-center justify-center relative my-6">

    <!-- FLOATING DECORATIVE LEFT CARD -->
    <div class="absolute left-4 lg:left-12 top-12 z-10 max-w-[200px] hidden lg:block animate-float-slow pointer-events-none">
      <div class="glass-pill rounded-2xl p-4 shadow-xl border border-white/90">
        <div class="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center mb-2.5 text-gray-800 shadow-2xs">
          ⚡
        </div>
        <h3 class="text-xs font-bold text-gray-900 leading-snug">Focus & Plan</h3>
        <p class="text-[10px] font-medium text-gray-500 mt-1">Join as a worker.</p>
      </div>
    </div>

    <!-- FLOATING DECORATIVE RIGHT CARD -->
    <div class="absolute right-4 lg:right-12 bottom-12 z-10 max-w-[200px] hidden lg:block animate-float-reverse pointer-events-none">
      <div class="glass-pill rounded-2xl p-4 shadow-xl border border-white/90">
        <div class="flex items-center -space-x-1.5 mb-2.5">
          <img class="w-5 h-5 rounded-full ring-2 ring-white object-cover" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="User 1" />
          <img class="w-5 h-5 rounded-full ring-2 ring-white object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80" alt="User 2" />
        </div>
        <h3 class="text-xs font-bold text-gray-900 leading-snug">Team Workflow</h3>
        <p class="text-[10px] font-medium text-gray-500 mt-1">Realtime task updates.</p>
      </div>
    </div>

    <!-- TOP RIGHT ROTATING BADGE -->
    <div class="absolute -top-4 right-12 hidden md:block pointer-events-none">
      <div class="relative flex items-center justify-center">
        <svg class="w-24 h-24 animate-spin-slow" viewBox="0 0 100 100">
          <path id="circlePathRegister" fill="none" d="M 50, 50 m -35, 0 a 35,35 0 1,1 70,0 a 35,35 0 1,1 -70,0" />
          <text class="text-[9.5px] font-bold tracking-[0.24em] fill-gray-500 uppercase">
            <textPath href="#circlePathRegister">
              A MORE FOCUSED YOU EVERYDAY •
            </textPath>
          </text>
        </svg>
        <div class="absolute inset-0 flex items-center justify-center">
          <span class="text-gray-900 text-sm">✦</span>
        </div>
      </div>
    </div>

    <!-- CENTER MINDLY°-STYLED REGISTER CARD -->
    <div class="w-full max-w-lg relative z-20">
      
      <div class="glass-card rounded-[2.2rem] p-8 sm:p-10 border border-white/90 shadow-2xl transition-all duration-300">
        
        <!-- Header Typography -->
        <div class="text-center mb-6">
          <h1 class="text-4xl sm:text-5xl font-normal text-[#0f172a] font-serif tracking-tight leading-none">
            A clearer mind
          </h1>
          <p class="text-xl sm:text-2xl font-serif italic text-gray-600 mt-1">
            Worker Registration
          </p>
          <div class="mt-3 inline-block bg-gray-100/90 text-gray-600 px-3 py-1 rounded-full text-[11px] font-extrabold uppercase tracking-widest">
            New Worker Account
          </div>
        </div>

        <!-- Registration Form -->
        <form id="register-form" class="space-y-4">
          
          <!-- Full Name Input -->
          <div>
            <label for="name" class="block text-[10px] font-extrabold uppercase tracking-widest text-gray-500 mb-1 ml-1">
              FULL NAME
            </label>
            <input type="text" id="name" required placeholder="e.g. Alex Morgan" 
              class="w-full px-4 py-2.5 bg-white/90 border border-gray-200/90 rounded-2xl text-sm font-medium text-gray-900 placeholder-gray-400 focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 shadow-2xs transition-all" />
          </div>

          <!-- Email Input -->
          <div>
            <label for="email" class="block text-[10px] font-extrabold uppercase tracking-widest text-gray-500 mb-1 ml-1">
              EMAIL ADDRESS
            </label>
            <input type="email" id="email" required placeholder="alex@garmentflow.com" 
              class="w-full px-4 py-2.5 bg-white/90 border border-gray-200/90 rounded-2xl text-sm font-medium text-gray-900 placeholder-gray-400 focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 shadow-2xs transition-all" />
          </div>

          <!-- Password Input -->
          <div>
            <label for="password" class="block text-[10px] font-extrabold uppercase tracking-widest text-gray-500 mb-1 ml-1">
              PASSWORD (MIN 6 CHARACTERS)
            </label>
            <div class="relative">
              <input type="password" id="password" minlength="6" required placeholder="••••••••" 
                class="w-full pl-4 pr-11 py-2.5 bg-white/90 border border-gray-200/90 rounded-2xl text-sm font-medium text-gray-900 placeholder-gray-400 focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 shadow-2xs transition-all" />
              <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-700 focus:outline-none" aria-label="Toggle password visibility">
                <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Department and Phone Row -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label for="department" class="block text-[10px] font-extrabold uppercase tracking-widest text-gray-500 mb-1 ml-1">
                DEPARTMENT
              </label>
              <select id="department" required 
                class="w-full px-4 py-2.5 bg-white/90 border border-gray-200/90 rounded-2xl text-sm font-medium text-gray-900 focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 shadow-2xs transition-all">
                <option value="">Select department...</option>
                <option value="Cutting">Cutting</option>
                <option value="Stitching">Stitching</option>
                <option value="Printing">Printing</option>
                <option value="Embroidery">Embroidery</option>
                <option value="Packing">Packing</option>
                <option value="Quality Check">Quality Check</option>
                <option value="Finishing">Finishing</option>
              </select>
            </div>

            <div>
              <label for="phone" class="block text-[10px] font-extrabold uppercase tracking-widest text-gray-500 mb-1 ml-1">
                PHONE NUMBER
              </label>
              <input type="text" id="phone" required placeholder="9876543210" 
                class="w-full px-4 py-2.5 bg-white/90 border border-gray-200/90 rounded-2xl text-sm font-medium text-gray-900 placeholder-gray-400 focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 shadow-2xs transition-all" />
            </div>
          </div>

          <!-- Error Message Alert -->
          <div id="error-message" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 p-3 rounded-xl flex items-start gap-2">
            <svg class="w-4 h-4 text-red-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="error-text"></span>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submit-btn"
            class="w-full bg-[#0f172a] hover:bg-black text-white font-bold py-3.5 rounded-full text-sm transition-all duration-200 shadow-md hover:shadow-lg flex items-center justify-center gap-2 group cursor-pointer mt-2">
            <span id="submit-btn-text">Create Worker Account</span>
            <span class="group-hover:translate-x-1 transition-transform">→</span>
          </button>

          <!-- Back to Login -->
          <div class="text-center pt-2">
            <a href="login.html" class="text-xs font-semibold text-gray-600 hover:text-gray-950 transition-colors">
              Already registered? <span class="underline">Sign In</span>
            </a>
          </div>

        </form>

      </div>

    </div>

  </main>

  <!-- BOTTOM FOOTER -->
  <footer class="w-full max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 pt-4 border-t border-gray-200/60 text-xs text-gray-500 font-medium z-20">
    <div class="flex items-center gap-2">
      <div class="flex items-center -space-x-1.5">
        <img class="w-5 h-5 rounded-full ring-2 ring-[#f7f7f5] object-cover" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="User 1" />
        <img class="w-5 h-5 rounded-full ring-2 ring-[#f7f7f5] object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80" alt="User 2" />
        <div class="w-5 h-5 rounded-full bg-white ring-2 ring-[#f7f7f5] flex items-center justify-center text-[9px] font-bold text-gray-800">+</div>
      </div>
      <span>Trusted by 50,000+ creators worldwide.</span>
    </div>

    <div class="flex items-center gap-2 text-gray-600">
      <span class="text-gray-900 text-sm">✦</span>
      <span>Less chaos. More clarity.</span>
    </div>
  </footer>

  <!-- SCRIPT LOGIC -->
  <script type="module">
    import { apiFetch, setSession, getUser } from './js/api.js';

    // Auto redirect if already logged in
    const user = getUser();
    if (user) {
      window.location.href = user.role === 'ADMIN' ? '/dashboard.html' : '/worker-home.html';
    }

    const form = document.getElementById('register-form');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const deptInput = document.getElementById('department');
    const phoneInput = document.getElementById('phone');
    const errorMsg = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');
    const submitBtn = document.getElementById('submit-btn');
    const submitBtnText = document.getElementById('submit-btn-text');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');

    // Password Visibility Toggle
    if (togglePasswordBtn) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeIcon.innerHTML = isPassword 
          ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.038 10.038 0 013.982-.863c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m-3.076 3.076l-9.8-9.8" />`
          : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
      });
    }

    // Form submit handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtnText.innerText = 'Creating Account...';

      try {
        const res = await apiFetch('/register', {
          method: 'POST',
          body: {
            name: nameInput.value.trim(),
            email: emailInput.value.trim(),
            password: passwordInput.value,
            role: 'WORKER',
            department: deptInput.value,
            phone: phoneInput.value.trim()
          }
        });

        setSession(res.access_token, res.user);
        window.location.href = '/worker-home.html';
      } catch (err) {
        errorText.innerText = err.message || 'Registration failed. Please check your details.';
        errorMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtnText.innerText = 'Create Worker Account';
      }
    });
  </script>

</body>
</html>
