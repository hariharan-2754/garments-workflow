<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - GarmentFlow</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-[#d8e0ed] min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <div class="max-w-sm w-full bg-[#0a0a0f] rounded-[2.2rem] border border-slate-800/80 shadow-2xl shadow-slate-900/50 p-8 sm:p-9 relative z-10 transition-all duration-300">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-white tracking-tight">Welcome</h1>
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest mt-1">GarmentFlow Access</p>
    </div>

    <form id="login-form" class="space-y-6">
      <div>
        <label for="email" class="block text-[11px] font-extrabold uppercase tracking-widest text-slate-400 mb-2">IDENTIFY</label>
        <div class="relative">
          <input type="email" id="email" required placeholder="admin@garmentflow.com" 
            class="w-full px-4 py-3 bg-[#13131c] border border-slate-800 rounded-xl text-sm font-medium text-white placeholder-slate-600 focus:outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-500 transition-all" />
        </div>
      </div>

      <div>
        <label for="password" class="block text-[11px] font-extrabold uppercase tracking-widest text-slate-400 mb-2">SECURITY</label>
        <div class="relative">
          <input type="password" id="password" required placeholder="••••••••" 
            class="w-full pl-4 pr-10 py-3 bg-[#13131c] border border-slate-800 rounded-xl text-sm font-medium text-white placeholder-slate-600 focus:outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-500 transition-all" />
          <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 focus:outline-none" aria-label="Toggle password visibility">
            <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <div id="error-message" class="hidden text-xs text-red-400 bg-red-950/40 border border-red-900/60 p-3 rounded-xl flex items-start gap-2">
        <svg class="w-4 h-4 text-red-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span id="error-text"></span>
      </div>

      <button type="submit" id="submit-btn"
        class="w-full bg-white hover:bg-slate-100 text-slate-950 font-extrabold py-3.5 rounded-xl text-sm transition-all duration-150 transform active:scale-[0.98] shadow-lg shadow-white/5 flex items-center justify-center">
        <span id="submit-btn-text">Unlock Session</span>
      </button>

      <div class="text-center pt-2">
        <span class="text-xs text-slate-600 hover:text-slate-400 transition-colors cursor-pointer">Lost credentials?</span>
      </div>
    </form>
  </div>

  <script type="module">
    import { apiFetch, setSession, getUser } from './js/api.js';

    const user = getUser();
    if (user) {
      window.location.href = user.role === 'ADMIN' ? '/dashboard.html' : '/worker-home.html';
    }

    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');
    const submitBtn = document.getElementById('submit-btn');
    const submitBtnText = document.getElementById('submit-btn-text');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');

    // Password Visibility Toggle
    if (togglePasswordBtn) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeIcon.innerHTML = isPassword 
          ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.038 10.038 0 013.982-.863c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m-3.076 3.076l-9.8-9.8" />`
          : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtnText.innerText = 'Unlocking...';

      try {
        const res = await apiFetch('/login', {
          method: 'POST',
          body: {
            email: emailInput.value.trim(),
            password: passwordInput.value
          }
        });

        setSession(res.access_token, res.user);

        if (res.user.role === 'ADMIN') {
          window.location.href = '/dashboard.html';
        } else {
          window.location.href = '/worker-home.html';
        }
      } catch (err) {
        errorText.innerText = err.message || 'Login failed. Please check your credentials.';
        errorMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtnText.innerText = 'Unlock Session';
      }
    });
  </script>
</body>
</html>
