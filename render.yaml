services:
  - type: web
    name: garments-workflow
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB_NAME
        value: garmentflow
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://garments-workflow.vercel.app,http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
